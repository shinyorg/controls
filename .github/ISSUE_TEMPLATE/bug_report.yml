name: 🐛 Bug Report
description: Report a problem with a Shiny Controls package
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below so we can reproduce and fix the issue quickly.

        > 💡 Before submitting, please search [existing issues](https://github.com/shinyorg/controls/issues) to avoid duplicates.

        > ⭐ **If you're using the library or filing any sort of issue/feature request - Please at least give this repository a [Star](https://github.com/shinyorg/controls)**
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package does this affect?
      options:
        # --- .NET MAUI ---
        - Shiny.Maui.Controls (core)
        - Shiny.Maui.Controls.Barcodes
        - Shiny.Maui.Controls.Camera
        - Shiny.Maui.Controls.Camera.Ai
        - Shiny.Maui.Controls.Camera.Barcode
        - Shiny.Maui.Controls.Camera.Documents
        - Shiny.Maui.Controls.Camera.Face
        - Shiny.Maui.Controls.Camera.Motion
        - Shiny.Maui.Controls.Camera.Ocr
        - Shiny.Maui.Controls.Desktop (tray icon / docking / quick entry window / hotkeys)
        - Shiny.Maui.Controls.Diagram
        - Shiny.Maui.Controls.FloorPlan
        - Shiny.Maui.Controls.Keyframe
        - Shiny.Maui.Controls.Keyframe.Export
        - Shiny.Maui.Controls.Markdown
        - Shiny.Maui.Controls.MediaElement
        - Shiny.Maui.Controls.MediaElement.Linux
        - Shiny.Maui.Controls.MermaidDiagrams
        - Shiny.Maui.Controls.Office
        - Shiny.Maui.Controls.SpeechAddins
        - Shiny.Maui.Controls.Themes.Aurora
        - Shiny.Maui.Controls.Themes.Material
        - Shiny.Maui.Controls.Themes.Ocean
        - Shiny.Maui.Controls.Themes.Terminal
        # --- Blazor ---
        - Shiny.Blazor.Controls (core)
        - Shiny.Blazor.Controls.Barcodes
        - Shiny.Blazor.Controls.Camera
        - Shiny.Blazor.Controls.Camera.Ai
        - Shiny.Blazor.Controls.Diagram
        - Shiny.Blazor.Controls.FloorPlan
        - Shiny.Blazor.Controls.Markdown
        - Shiny.Blazor.Controls.MediaElement
        - Shiny.Blazor.Controls.MermaidDiagrams
        - Shiny.Blazor.Controls.Office
        - Shiny.Blazor.Controls.SpeechAddins
        - Shiny.Blazor.Controls.Themes.Aurora
        - Shiny.Blazor.Controls.Themes.Material
        - Shiny.Blazor.Controls.Themes.Ocean
        - Shiny.Blazor.Controls.Themes.Terminal
        # --- Shared / internal ---
        - Shiny.Controls.Camera.Shared
        - Shiny.Controls.Diagram.Shared
        - Shiny.Controls.FloorPlan.Shared
        - Shiny.Controls.Gantt.Shared
        - Shiny.Controls.Keyframe.Shared
        - Shiny.Controls.MediaElement.Shared
        - Shiny.Controls.MotionIcons.Shared
        - Shiny.Controls.Office.Shared
        - Shiny.Controls.Office.Skia
        - Not sure / multiple
    validations:
      required: true
  - type: input
    id: control
    attributes:
      label: Control / Feature
      description: Which control or feature is involved?
      placeholder: e.g. ChatView, DataGrid, TableView, FloatingPanel, CameraView, SpreadsheetView, Walkthrough, Toast, Docking
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Package Version
      description: Which NuGet version are you running?
      placeholder: e.g. 1.2.3
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Affected Platform(s)
      description: Where does this reproduce? Pick every platform you've confirmed it on.
      multiple: true
      options:
        - iOS
        - Android
        - Mac Catalyst
        - macOS (AppKit — net10.0-macos)
        - Windows (WinUI)
        - Linux (GTK4)
        - Blazor WebAssembly
        - Blazor Server
        - Blazor Hybrid (MAUI BlazorWebView)
        - All platforms
        - Not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Add a '...' control
        2. Set property '...'
        3. Run on '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal reproduction (code / XAML / Razor)
      description: Paste the smallest snippet that reproduces the problem. A link to a repro repo is even better.
      render: xml
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Stack trace / logs
      description: Any relevant exception, stack trace, console output, or browser devtools console output.
      render: shell
    validations:
      required: false
  - type: input
    id: dotnet
    attributes:
      label: .NET / MAUI version
      description: Output of `dotnet --version`, your target framework(s), and the MAUI workload version if relevant.
      placeholder: e.g. .NET 10.0.300, net10.0-ios, MAUI 10.0.51
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device / OS / Browser
      description: The device, OS version, and — for Blazor — the browser you saw this on.
      placeholder: e.g. iPhone 16 Pro (iOS 26.0) simulator, Pixel 8 (Android 15), Chrome 140 on macOS 15.5
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, recordings, theme in use, or anything else that might help.
    validations:
      required: false
