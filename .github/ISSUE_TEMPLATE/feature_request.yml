name: ✨ Feature Request
description: Suggest a new control, feature, or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please describe what you'd like to see and why.

        > 💡 Search [existing issues](https://github.com/shinyorg/controls/issues) first — someone may have already requested it.

        > ⭐ **If you're using the library or filing any sort of issue/feature request - Please at least give this repository a [Star](https://github.com/shinyorg/controls)**
  - type: dropdown
    id: host
    attributes:
      label: Host
      description: Which host(s) should this land on?
      multiple: true
      options:
        - .NET MAUI
        - Blazor
        - Both (parity)
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Target Package
      description: Which package would this affect? (or propose a new one)
      options:
        - Core (Shiny.Maui.Controls / Shiny.Blazor.Controls)
        - Barcodes (*.Controls.Barcodes)
        - Camera (*.Controls.Camera)
        - Camera AI (*.Controls.Camera.Ai)
        - Camera analyzers (Shiny.Maui.Controls.Camera.Barcode / .Documents / .Face / .Motion / .Ocr)
        - Desktop — MAUI only (Shiny.Maui.Controls.Desktop)
        - Diagram (*.Controls.Diagram / Shiny.Controls.Diagram.Shared)
        - Floor Plan (*.Controls.FloorPlan / Shiny.Controls.FloorPlan.Shared)
        - Gantt (core packages / Shiny.Controls.Gantt.Shared)
        - Keyframe — MAUI only (Shiny.Maui.Controls.Keyframe / .Keyframe.Export)
        - Markdown (*.Controls.Markdown)
        - MediaElement (*.Controls.MediaElement)
        - MediaElement Linux — MAUI only (Shiny.Maui.Controls.MediaElement.Linux)
        - Mermaid Diagrams (*.Controls.MermaidDiagrams)
        - Motion Icons (core packages / Shiny.Controls.MotionIcons.Shared)
        - Office — Spreadsheet / Document / Slide (*.Controls.Office)
        - Speech Addins (*.Controls.SpeechAddins)
        - Themes (Aurora / Material / Ocean / Terminal)
        - New package / control
        - Not sure
    validations:
      required: true
  - type: input
    id: control
    attributes:
      label: Control / Feature
      description: Which existing control does this extend, or what would the new one be called?
      placeholder: e.g. DataGrid column grouping, new TimelineView
    validations:
      required: false
  - type: dropdown
    id: platforms
    attributes:
      label: Relevant Platform(s)
      description: Which platforms should this target?
      multiple: true
      options:
        - iOS
        - Android
        - Mac Catalyst
        - macOS (AppKit — net10.0-macos)
        - Windows (WinUI)
        - Linux (GTK4)
        - Blazor WebAssembly
        - Blazor Server
        - Blazor Hybrid (MAUI BlazorWebView)
        - All platforms
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve? Is your request related to a frustration? "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen. Include an API sketch (properties, events, methods) if you have one in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've tried or considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links to similar controls in other libraries, or any other context.
    validations:
      required: false
