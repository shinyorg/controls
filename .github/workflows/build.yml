name: Build

# Every push to main, and every pull request into it: build the packages the way a release builds them, without
# publishing. Releases come from tags - see release.yml. Toolchain pins match release.yml - bump them together.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '.claude-plugins/**'
      - 'SKILLS/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.claude-plugins/**'
      - 'SKILLS/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # SDK and workload set pinned to 10.0.404, the same as global.json: its net10.0-ios/-maccatalyst packs
    # match Xcode 27.2 and carry the iOS 27.2 bindings Shiny.Maui.Controls.Foldables compiles against
    # (UIHinge). setup-dotnet's `workloads:` always takes the latest, so the workloads are installed by hand.
    # No --version here: the SDK rejects it when global.json already sets workloadVersion, and takes the set from there.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '10.0.404'

    - name: Install workloads
      run: dotnet workload install maui macos

    - name: Build
      run: dotnet build Build.slnf /restore -m -property:Configuration=Release

    - name: Post NuGet Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-artifacts
        path: '**/*.nupkg'
        retention-days: 5
