name: Build

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
  push:
    branches:
    - main
    - dev
    - preview
    - v*
    paths-ignore:
      - '.claude-plugins/**'
      - 'SKILLS/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC)
      contents: read

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          fetch-depth: 0

    # SDK and workload set pinned to 10.0.404, the same as global.json: its net10.0-ios/-maccatalyst packs
    # match Xcode 27.2 and carry the iOS 27.2 bindings Shiny.Maui.Controls.Foldables compiles against
    # (UIHinge). setup-dotnet's `workloads:` always takes the latest, so the workloads are installed by hand.
    # No --version here: the SDK rejects it when global.json already sets workloadVersion, and takes the set from there.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '10.0.404'

    - name: Install workloads
      run: dotnet workload install maui macos

    - name: Build
      run: dotnet build Build.slnf /restore -m -property:Configuration=Release -property:PublicRelease=true

    - name: Post NuGet Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-artifacts
        path: '**/*.nupkg'

    - name: Publish Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nugets
        path: ${{ github.workspace }}/artifacts
        retention-days: 5

    - name: NuGet Login (OIDC)
      id: nuget-login
      if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v') }}
      uses: NuGet/login@v1
      with:
        user: aritchie

    - name: Publish NuGets
      if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v') }}
      run: dotnet nuget push **\*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
