<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample.Blazor</title>
    <base href="/" />
    <!-- Shiny Controls theme tokens (Basic, ships in the core package). Swap or add a theme
         pack stylesheet after this line to override, e.g. shiny-theme-ocean.css. -->
    <link id="shiny-theme" href="_content/Shiny.Blazor.Controls/css/shiny-theme.css" rel="stylesheet" />
    <link href="_content/Shiny.Blazor.Controls/css/shiny-splash.css" rel="stylesheet" />
    <link href="css/app#[.{fingerprint}].css" rel="stylesheet" />
    <link href="Sample.Blazor#[.{fingerprint}].styles.css" rel="stylesheet" />
    <!-- GitHub Pages serves everything with max-age=600 and no way to change it, so an unversioned
         dotnet.js kept a plain refresh on the previous build for up to ten minutes after a deploy.
         OverrideHtmlAssetPlaceholders (Sample.Blazor.csproj) fills the #[.{fingerprint}] markers and
         this import map at publish, pointing dotnet.js at its fingerprinted file. -->
    <script type="importmap"></script>
    <link rel="preload" id="webassembly" />
</head>
<body>
    <!-- The stock template's loading UI lived in here. It is redundant now: it sits INSIDE #app,
         so Blazor wipes it at attach and it can only ever cover the framework download. The
         SplashScreen below covers that phase AND app startup. -->
    <div id="app"></div>

    <!-- SplashScreen. Note it lives OUTSIDE #app: Blazor clears #app's contents the moment it
         attaches the root component, which is long before the app is actually ready. -->
    <div id="shiny-splash"
         data-shiny-splash
         data-title="Shiny Controls"
         data-subtitle="Blazor Gallery"
         data-logo="css/shiny_logo.png"
         data-spinner="ring"
         data-status="Starting up…"
         data-blazor-progress="true"
         data-min-duration="600"
         data-fade="300"></div>

    <script src="_content/Shiny.Blazor.Controls/splash.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
